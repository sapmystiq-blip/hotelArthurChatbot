<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Hotel Chat Demo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Floating bubble -->
  <div id="chat-bubble" title="Chat">💬</div>

  <!-- Hidden chat window -->
  <div id="chat-window">
    <div id="chat-header">
      <span class="brand">Hotel • Chat • Demo</span>
      <span id="chat-close" aria-label="Close">✖</span>
    </div>

    <div id="chat-messages"></div>

    <div id="chat-input">
      <input id="user-input" type="text" placeholder="Ask in English or Finnish… / Kysy suomeksi tai englanniksi…"/>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="/script.js" defer></script>
<script>
(function() {
  function postHeight() {
    try {
      var h = document.documentElement.scrollHeight || document.body.scrollHeight || 0;
      window.parent && window.parent.postMessage({ type: 'chatbot:contentHeight', height: h }, '*');
    } catch (e) {}
  }
  // Observe DOM changes (messages rendered etc.)
  if ('ResizeObserver' in window) {
    try { new ResizeObserver(postHeight).observe(document.documentElement); } catch (e) {}
  }
  try { new MutationObserver(postHeight).observe(document.body, { childList: true, subtree: true }); } catch (e) {}
  window.addEventListener('load', postHeight);
  document.addEventListener('DOMContentLoaded', postHeight);
  // Optional helper you can call when a new chat message arrives
  window.notifyParentNewMessage = function() {
    try {
      window.parent && window.parent.postMessage({ type: 'chatbot:newMessage' }, '*');
      postHeight();
    } catch (e) {}
  };
})();
</script>
</body>
</html>
