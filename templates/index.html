<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Hotel Arthur Chat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Floating bubble -->
  <div id="chat-bubble" title="Chat">💬</div>

  <!-- Hidden chat window -->
  <div id="chat-window">
    <div id="chat-header">
      <span class="brand">Hotel Arthur • Chat</span>
      <span id="chat-close" aria-label="Close">✖</span>
    </div>

    <div id="chat-messages"></div>

    <div id="chat-input">
      <input id="user-input" type="text" placeholder="Ask in English or Finnish… / Kysy suomeksi tai englanniksi…"/>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="/script.js" defer></script>
</body>
</html>
