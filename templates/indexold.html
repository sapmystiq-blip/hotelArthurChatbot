<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Arthur Chatbot</title>
  <link rel="stylesheet" href="/style_arthur.css">
</head>
<body>
  <!-- Chat bubble button -->
  <div id="chat-bubble">💬</div>

  <div id="chat-window">
    <div id="chat-header">
      Hotel Arthur • Chat
      <span id="chat-close">✖</span>
    </div>

    <div id="chat-messages"></div>
    <div id="chat-input">
      <input type="text" id="user-input" placeholder="Ask in English or Finnish… / Kysy suomeksi tai englanniksi…">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="/script_arthur.js" defer></script>
</body>
</html>
